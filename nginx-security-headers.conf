# Security Headers for PoPP Landing Page
# Include this file in your nginx server block:
#   include /path/to/nginx-security-headers.conf;

# Prevent clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable XSS protection (legacy browsers)
add_header X-XSS-Protection "1; mode=block" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions policy (restrict browser features)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Content Security Policy (adjust as needed for your site)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://pagead2.googlesyndication.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://popp.thharko.com https://chain.thharko.com https://www.google-analytics.com https://analytics.google.com; frame-ancestors 'self';" always;

# HSTS (uncomment after confirming HTTPS works for all subdomains)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
